<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraSonus — 20 Favicon Showcase & Selector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border: rgba(56, 189, 248, 0.15);
      --accent: #00F0FF;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #0c1938 0%, #030712 60%);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 24px 80px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00F0FF;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #FFFFFF 30%, #38BDF8 70%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 16px;
      color: #94a3b8;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.6;
    }
    /* Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #00F0FF;
      color: #030712;
      border-color: #00F0FF;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
    }
    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.15);
    }
    .card-num {
      position: absolute;
      top: 18px;
      right: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }
    .card-cat {
      font-size: 11px;
      font-weight: 600;
      color: #38BDF8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }
    /* Preview Stage */
    .preview-stage {
      background: #020617;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .large-preview {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 4px 16px rgba(0, 240, 255, 0.25));
    }
    /* Tab Mockups */
    .tab-bars {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 6px;
    }
    .tab-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .tab-dark {
      background: #202124;
      color: #e8eaed;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .tab-light {
      background: #f1f3f4;
      color: #202124;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .tab-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }
    /* Actions */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #00F0FF;
      color: #030712;
      border: none;
    }
    .btn-primary:hover {
      background: #38BDF8;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00F0FF;
      color: #00F0FF;
    }
    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #00F0FF;
      color: #030712;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.4);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">NASA Earth Telemetry × Sonification</div>
      <h1>TerraSonus Favicon Collection</h1>
      <p class="subtitle">
        20 simple, attractive, and elegant vector favicons crafted specifically for high-contrast visibility at 16×16, 32×32, and high-DPI displays.
      </p>
    </header>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterCategory('all')">All (20)</button>
      <button class="filter-btn" onclick="filterCategory('Planetary Harmonics')">Planetary Harmonics</button>
      <button class="filter-btn" onclick="filterCategory('Frequency Equalizer')">Frequency Equalizer</button>
      <button class="filter-btn" onclick="filterCategory('Orbital Harmonics')">Orbital Harmonics</button>
      <button class="filter-btn" onclick="filterCategory('Monograms')">Monograms</button>
      <button class="filter-btn" onclick="filterCategory('Space Telemetry')">Space Telemetry</button>
      <button class="filter-btn" onclick="filterCategory('NASA Heritage')">NASA Heritage</button>
    </div>

    <div class="grid" id="faviconGrid"></div>
  </div>

  <div id="toast">Copied to clipboard!</div>

  <script>
    const faviconsData = [
      {
        id: "01-sine-earth",
        name: "The Sine Earth",
        category: "Planetary Harmonics",
        desc: "Vibrant Earth sphere intersected by a continuous sinusoidal acoustic wave. Pure, modern, and instantly readable.",
        file: "/favicons/favicon-01-sine-earth.svg"
      },
      {
        id: "02-acoustic-latitude",
        name: "Acoustic Latitudes",
        category: "Frequency Equalizer",
        desc: "Five horizontal telemetry soundwave bars mathematically sculpted to form the silhouette of an Earth sphere.",
        file: "/favicons/favicon-02-acoustic-latitude.svg"
      },
      {
        id: "03-pulsar-rings",
        name: "Pulsar Rings",
        category: "Orbital Harmonics",
        desc: "A glowing blue Earth core orbited by two concentric acoustic wavefront rings tilted at a dynamic 30° cosmic angle.",
        file: "/favicons/favicon-03-pulsar-rings.svg"
      },
      {
        id: "04-echo-meridian",
        name: "Echo Meridian",
        category: "Planetary Harmonics",
        desc: "Minimalist Earth sphere boundary with a central vertical harmonic frequency line replacing the Prime Meridian.",
        file: "/favicons/favicon-04-echo-meridian.svg"
      },
      {
        id: "05-orbital-pulse",
        name: "Orbital Pulse Beacon",
        category: "Orbital Harmonics",
        desc: "A satellite beacon emitting three crisp radio-acoustic waves while tracing an orbital trajectory around Earth.",
        file: "/favicons/favicon-05-orbital-pulse.svg"
      },
      {
        id: "06-sonar-horizon",
        name: "The Sonar Horizon",
        category: "Space Telemetry",
        desc: "The luminous curved horizon of Earth seen from orbit, radiating three upward harmonic soundwaves into the cosmos.",
        file: "/favicons/favicon-06-sonar-horizon.svg"
      },
      {
        id: "07-harmonic-t",
        name: "Harmonic 'T' Monogram",
        category: "Monograms",
        desc: "A bespoke modern letter 'T' where the crossbar is an oscillating sine wave and the stem anchors into an Earth curve.",
        file: "/favicons/favicon-07-harmonic-t.svg"
      },
      {
        id: "08-dual-resonance-ts",
        name: "Dual Resonance 'TS'",
        category: "Monograms",
        desc: "An intertwined continuous fluid stroke that traces both 'T' and 'S' resembling an orbital sonification curve.",
        file: "/favicons/favicon-08-dual-resonance-ts.svg"
      },
      {
        id: "09-standing-wave",
        name: "The Standing Wave",
        category: "Planetary Harmonics",
        desc: "Two intersecting harmonic wave phases within a glowing celestial halo, representing acoustic resonance nodes.",
        file: "/favicons/favicon-09-standing-wave.svg"
      },
      {
        id: "10-triple-crest",
        name: "Triple Harmonic Crest",
        category: "Frequency Equalizer",
        desc: "Three bold equalizer bars curved like dynamic acoustic monoliths with a central planetary pulse node.",
        file: "/favicons/favicon-10-triple-crest.svg"
      },
      {
        id: "11-voyager-gold",
        name: "Voyager Golden Frequency",
        category: "NASA Heritage",
        desc: "Inspired by NASA's Voyager Golden Record: rich cosmic obsidian disc etched with warm metallic solar pulsar acoustic lines.",
        file: "/favicons/favicon-11-voyager-gold.svg"
      },
      {
        id: "12-quantum-orbit",
        name: "Resonant Lemniscate",
        category: "Orbital Harmonics",
        desc: "An infinity / figure-8 harmonic wave looping perpetually around an illuminated telemetry Earth core.",
        file: "/favicons/favicon-12-quantum-orbit.svg"
      },
      {
        id: "13-cosmic-tuning-fork",
        name: "The Cosmic Tuning Fork",
        category: "Frequency Equalizer",
        desc: "A futuristic acoustic tuning fork whose two radiant tines curve symmetrically to cradle the Earth sphere.",
        file: "/favicons/favicon-13-cosmic-tuning-fork.svg"
      },
      {
        id: "14-telemetry-drop",
        name: "The Telemetry Note",
        category: "Monograms",
        desc: "A minimalist fusion of an acoustic musical eighth note and an orbital telemetry sensor tracking Earth.",
        file: "/favicons/favicon-14-telemetry-drop.svg"
      },
      {
        id: "15-hex-mission-patch",
        name: "NASA Hex Mission Patch",
        category: "NASA Heritage",
        desc: "Modern aerospace telemetry badge: a dark chamfered hexagon enclosing an acoustic waveform Earth sphere.",
        file: "/favicons/favicon-15-hex-mission-patch.svg"
      },
      {
        id: "16-magnetosphere-loops",
        name: "Magnetosphere Harmonics",
        category: "Space Telemetry",
        desc: "Earth's geomagnetic field lines modeled as symmetric acoustic resonance loops shielding our home planet.",
        file: "/favicons/favicon-16-magnetosphere-loops.svg"
      },
      {
        id: "17-ionosphere-radiance",
        name: "Ionosphere Acoustic Aura",
        category: "Planetary Harmonics",
        desc: "Solid deep blue Earth surrounded by segmented multi-layered acoustic ripples representing sonified atmosphere.",
        file: "/favicons/favicon-17-ionosphere-radiance.svg"
      },
      {
        id: "18-sound-aperture",
        name: "Terra Aperture",
        category: "Frequency Equalizer",
        desc: "A sleek optical-acoustic ring with high-contrast frequency notches, bold and unmistakable at 16x16.",
        file: "/favicons/favicon-18-sound-aperture.svg"
      },
      {
        id: "19-pure-pulse-brackets",
        name: "Pure Pulse Brackets",
        category: "Space Telemetry",
        desc: "Ultra-pure iconic design: a vibrant core Earth sphere flanked by two clean acoustic wavefront parentheses.",
        file: "/favicons/favicon-19-pure-pulse-brackets.svg"
      },
      {
        id: "20-terra-sonus-crest",
        name: "TerraSonus Master Crest",
        category: "Planetary Harmonics",
        desc: "The flagship app-badge: deep space squircle, dual-layer luminescent Earth globe, and dynamic soundwave harmonics.",
        file: "/favicons/favicon-20-terra-sonus-crest.svg"
      }
    ];

    let currentFilter = 'all';

    function renderCards() {
      const grid = document.getElementById('faviconGrid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'all' 
        ? faviconsData 
        : faviconsData.filter(f => f.category === currentFilter);

      filtered.forEach((fav, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-num">#${String(index + 1).padStart(2, '0')}</div>
          <div class="card-cat">${fav.category}</div>
          <div class="card-title">${fav.name}</div>
          <div class="card-desc">${fav.desc}</div>
          
          <div class="preview-stage">
            <img src="${fav.file}" alt="${fav.name}" class="large-preview" />
            <div class="tab-bars">
              <div class="tab-row tab-dark">
                <img src="${fav.file}" class="tab-icon" />
                <span class="tab-title">TerraSonus | NASA Sonification</span>
              </div>
              <div class="tab-row tab-light">
                <img src="${fav.file}" class="tab-icon" />
                <span class="tab-title">TerraSonus | NASA Sonification</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-outline" onclick="copySvgCode('${fav.file}')">
              Copy SVG
            </button>
            <button class="btn btn-primary" onclick="setAsFavicon('${fav.file}', '${fav.name}')">
              Use Active
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'all' && btn.textContent.includes('All')));
      });
      renderCards();
    }

    async function copySvgCode(path) {
      try {
        const res = await fetch(path);
        const svg = await res.text();
        await navigator.clipboard.writeText(svg);
        showToast('SVG code copied to clipboard!');
      } catch (err) {
        showToast('Failed to copy SVG');
      }
    }

    function setAsFavicon(filePath, name) {
      let link = document.querySelector("link[rel*='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = filePath + '?v=' + Date.now();
      showToast(`Active tab favicon changed to: ${name}`);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    renderCards();
  </script>
</body>
</html>
